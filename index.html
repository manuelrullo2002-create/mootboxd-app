<!doctype html>

<html lang="it">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <title>MOOTBOXD</title>

  <!-- Icona iPhone -->

  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="./icons/mootboxd-icon.png.png"
  >

  <!-- Favicon -->

  <link
    rel="icon"
    type="image/png"
    href="./icons/mootboxd-icon.png.png"
  >

  <!-- PWA -->

  <link
    rel="manifest"
    href="./manifest.json"
  >

  <!-- iPhone / iPad -->

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="MOOTBOXD"
  >

  <!-- Android / browser -->

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="theme-color"
    content="#0f1117"
  >

  <style>

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #0f1117;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      color: white;
    }

    .screen {
      text-align: center;
    }

    .logo {
      width: 110px;
      height: 110px;
      object-fit: cover;
      border-radius: 24px;
      margin-bottom: 20px;
    }

    .title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .subtitle {
      margin-top: 8px;
      font-size: 14px;
      opacity: .6;
    }

  </style>

</head>

<body>

  <div class="screen">

    <img
      class="logo"
      src="./icons/mootboxd-icon.png.png"
      alt="MOOTBOXD"
    >

    <div class="title">
      MOOTBOXD
    </div>

    <div class="subtitle">
      App del club
    </div>

  </div>

  <script>

    const mootboxdUrl =
      "https://script.google.com/macros/s/AKfycbyEDc9UdRs4ZkrckSS1JSMAbIiG-FBEaIWd1e1qHUtGegM8yfduqPgLc_aaTLO_0g/exec";

    const isStandalone =
      window.navigator.standalone === true ||
      window.matchMedia(
        "(display-mode: standalone)"
      ).matches;

    if (isStandalone) {

      window.location.replace(
        mootboxdUrl
      );

    }

  </script>

</body>

</html>
